name: Daily World 60 — Publish

on:
  schedule:
    # 1 日 6 本 = 2 バッチ × 3 本（2026-06-27: ハードトピックゲート＋単一トピック構成へ。
    # 紛争/災害/記録に絞り「狭く厚く」= 1本ブレイクで10K狙い）。視聴者ピーク UTC 14-22 の
    # 2窓に分散・各バッチ stagger 30分。batch1=当日Routineの stories 1-3 を 20:00、
    # batch2=前日Routineの stories 4-6 を 14:00（Routineは18:00 UTC生成のため前日分を使う）。
    # GH cron は数時間遅延しうる。
    - cron: '0 20 * * *'
    - cron: '0 14 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "preview"
        type: choice
        options:
          - preview      # 動画生成のみ、投稿しない (毎朝の cron と同じ動作)
          - publish      # 既存の preview 成果物を使って実投稿
          - full         # 動画生成 + 投稿 を一気にやる（要注意）
          - delete       # 指定 videoId を YouTube から削除 (delete_video_ids input 必須)
      delete_video_ids:
        description: "削除する YouTube videoId (カンマ区切り、mode=delete 時のみ)"
        required: false
        default: ""
      date:
        description: "日付上書き (YYYY-MM-DD UTC)"
        required: false
        default: ""
      batch:
        description: "バッチ番号 (1=朝/2=昼/3=夜。9本台本を3本ずつ。空=全ストーリー)"
        required: false
        default: ""
      skip_youtube:
        description: "YouTube をスキップ (重複投稿回避)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      publish_skip:
        description: "追加でスキップするプラットフォーム (カンマ区切り: youtube,instagram)。tiktok,x は常時オフ。指定時 skip_youtube より優先"
        required: false
        default: ""
      force_republish:
        description: "重複防止(台帳/当日既投稿)を無視して強制再投稿 (BGM 差し替え等の再アップ用)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      script_source_file:
        description: "台本ソースをDriveでなくリポジトリ内ファイルから読む (独自トピック用。例 content/dw60-trending-2026-06-10.json)。空=Drive取得"
        required: false
        default: ""
      publish_stagger_minutes:
        description: "YouTube公開の時間差(分)。2本目以降を予約公開でずらす。空/0=同時公開"
        required: false
        default: ""
      ig_max_per_run:
        description: "Instagram の 1 run あたり投稿上限 (空=scheduleは1/手動は0=無制限)"
        required: false
        default: ""

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DRIVE_FOLDER_NAME: "Daily World 60"

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      # 画像ハイブリッド: FAL_KEY があれば hero 画像だけ fal.ai (FLUX.2 pro) で高品質化。
      # 未設定なら fetch-broll が自動で無料 Pollinations にフォールバック (何も壊れない)。
      FAL_KEY: ${{ secrets.FAL_KEY }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      X_COOKIES_B64: ${{ secrets.X_COOKIES_B64 }}
      INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
      TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}

      # Instagram Graph API (公式・完全自動)。secrets 未設定の間は IG は安全にスキップされる。
      IG_GRAPH_ACCESS_TOKEN: ${{ secrets.IG_GRAPH_ACCESS_TOKEN }}
      IG_GRAPH_USER_ID: ${{ secrets.IG_GRAPH_USER_ID }}

      EN_VOICE: en-US-AvaNeural

      # スケジュール起動 (朝昼夜 3 cron) は全て full(生成+投稿)。手動 dispatch は入力の mode を尊重。
      RUN_MODE: ${{ github.event_name == 'schedule' && 'full' || github.event.inputs.mode }}
      DATE_OVERRIDE: ${{ github.event.inputs.date }}
      # 配信先は YouTube + Instagram(Graph API) のみ。TikTok/X は常時オフ (どの trigger でも
      # tiktok,x を必ず PUBLISH_SKIP に含める)。任意で publish_skip 追加 / skip_youtube 可。
      # IG は IG_GRAPH_* secrets が入るまで publish-all 側で自動スキップ (cookie 経路は廃止 2026-06-12)。
      PUBLISH_SKIP: ${{ format('tiktok,x{0}{1}', github.event.inputs.publish_skip != '' && format(',{0}', github.event.inputs.publish_skip) || '', github.event.inputs.skip_youtube == 'true' && ',youtube' || '') }}
      # IG は 1 run あたり 1 本まで (= 朝昼夜で1日3リール。連投スパム判定の回避)
      IG_MAX_PER_RUN: ${{ github.event.inputs.ig_max_per_run || (github.event_name == 'schedule' && '1' || '0') }}
      # 強制再投稿 (差し替え再アップ用)。schedule では常に false。
      FORCE_REPUBLISH: ${{ github.event.inputs.force_republish || 'false' }}
      # 台本ソースをリポジトリ内ファイルから読む (独自トピック用)。空=Drive取得。schedule では常に空。
      SCRIPT_SOURCE_FILE: ${{ github.event.inputs.script_source_file }}
      # YouTube 1本ずつ時間差公開 (2本目以降 private+publishAt 予約)。schedule は 30分間隔 = 各バッチ3本が30分おき → 4バッチ12本が UTC 14:00-21:00 のピークに収まる(衝突なし)。
      PUBLISH_STAGGER_MINUTES: ${{ github.event.inputs.publish_stagger_minutes || (github.event_name == 'schedule' && '30' || '0') }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 注意: この GCP 認証は全 run(preview/full)の必須前提。GCP プロジェクト
      #       (daily-world-60) が停止していると token 交換が失敗し、ジョブ全体がここで
      #       中断する。Drive から台本を取得できないため continue-on-error にはしない。
      #       復旧手順は docs/SECRETS-SETUP.md の「GCP プロジェクト復旧」を参照。
      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + librsvg + xvfb (for headed Playwright)
        # GH runners intermittently hang on apt mirrors, which was eating the whole
        # 30-min job budget and cancelling batches (e.g. 2026-06-18 batch1). Bound each
        # attempt with `timeout` and retry up to 3x so a stuck mirror fails fast.
        timeout-minutes: 12
        run: |
          ok=""
          for i in 1 2 3; do
            sudo timeout 180 apt-get update \
              && sudo timeout 300 apt-get install -y ffmpeg librsvg2-bin xvfb espeak-ng \
              && ok=1 && break
            echo "apt attempt $i failed/timed out — retrying"; sleep 15
          done
          [ -n "$ok" ] || { echo "apt failed after 3 attempts"; exit 1; }
          command -v ffmpeg >/dev/null && command -v rsvg-convert >/dev/null

      - name: Install edge-tts (fallback voice engine)
        run: pip install edge-tts

      # Kokoro-82M = 既定の無料 TTS (2026-07-23)。~340MB モデル + spaCy en_core_web_sm を
      # HF/pip キャッシュ。espeak-ng は misaki の固有名詞フォールバック G2P 用 (apt で導入済)。
      - name: Cache Kokoro / HuggingFace models + pip
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/huggingface
            ~/.cache/pip
          key: kokoro-hf-v1

      - name: Install Kokoro TTS (free voice engine)
        timeout-minutes: 10
        run: |
          # CPU-only torch: default PyPI torch pulls the ~2.5GB CUDA build → blows CI disk/timeout.
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install "kokoro>=0.9,<1.0" soundfile
          python -m spacy download en_core_web_sm || pip install en_core_web_sm
          # misaki の bundled espeakng_loader は環境依存で壊れることがあるため、
          # apt 版 espeak-ng を明示指定 (phonemizer が env を尊重する)。
          LIB=$(find /usr/lib /lib -name 'libespeak-ng.so*' 2>/dev/null | head -1)
          PHON=$(find /usr/lib /usr/share /lib -name 'phontab' 2>/dev/null | head -1)
          if [ -n "$LIB" ]; then echo "PHONEMIZER_ESPEAK_LIBRARY=$LIB" >> $GITHUB_ENV; fi
          if [ -n "$PHON" ]; then
            DATA=$(dirname "$PHON")
            echo "ESPEAK_DATA_PATH=$DATA" >> $GITHUB_ENV
            echo "ESPEAKNG_DATA_PATH=$DATA" >> $GITHUB_ENV
          fi

      # (2.5Dパララックスは既定OFF=不自然のため撤回・2026-07-20。PARALLAX=on 復活時は
      #  rembg install + ~/.u2net cache をここに戻す。レシピは motion-broll スキル参照)

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright Chromium
        # Chromium is only needed by the X / TikTok cookie publishers. Scheduled runs always
        # skip tiktok,x (IG=Graph API, YouTube doesn't use Playwright), so skip the install
        # entirely there. When it does run, bound it + make it non-fatal so a hung download
        # can never eat the 30-min job budget (was causing batch runs to be cancelled).
        if: env.RUN_MODE != 'preview' && (!contains(format(',{0},', env.PUBLISH_SKIP), ',x,') || !contains(format(',{0},', env.PUBLISH_SKIP), ',tiktok,'))
        timeout-minutes: 5
        continue-on-error: true
        run: npx playwright install --with-deps chromium

      - name: Resolve date & batch
        id: date
        env:
          SCHED: ${{ github.event.schedule }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_BATCH: ${{ github.event.inputs.batch }}
        run: |
          if [ -n "$SCHED" ]; then
            # 2 cron → batch と日付オフセット。batch2 は前日 Routine 分 (Routine は 18:00 UTC 生成)。
            case "$SCHED" in
              "0 20 * * *") BATCH=1; OFF=0 ;;
              "0 14 * * *") BATCH=2; OFF=1 ;;
              *)            BATCH=1; OFF=0 ;;
            esac
            DATE=$(date -u -d "-${OFF} day" +%Y-%m-%d)
          else
            if [ -n "$IN_DATE" ]; then DATE="$IN_DATE"; else DATE=$(date -u +%Y-%m-%d); fi
            BATCH="$IN_BATCH"
          fi
          if [ -n "$BATCH" ]; then WORK="${DATE}-b${BATCH}"; else WORK="$DATE"; fi
          echo "realdate=$DATE" >> $GITHUB_OUTPUT
          echo "work=$WORK"     >> $GITHUB_OUTPUT
          echo "OUT_DIR=output/$WORK" >> $GITHUB_ENV
          [ -n "$BATCH" ] && echo "BATCH=$BATCH" >> $GITHUB_ENV
          mkdir -p "output/$WORK"
          echo "Real date: $DATE | batch: ${BATCH:-none} | WORK: $WORK | mode: ${{ env.RUN_MODE }}"

      # --- Generation phase (preview / full) ---
      - name: Step A — Fetch scripts from Drive
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete'
        run: npx tsx scripts/fetch-scripts-from-drive.ts ${{ steps.date.outputs.realdate }}

      - name: Step B — Per-story narrations (voice + vtt)
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete'
        run: npx tsx scripts/tts-per-story.ts ${{ steps.date.outputs.realdate }}

      - name: Step B2 — Fetch background images (Wikimedia Commons)
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete'
        run: npx tsx scripts/fetch-broll.ts ${{ steps.date.outputs.realdate }}

      - name: Step C — Build 3 news videos (60s each, VTT-synced)
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete'
        run: npx tsx scripts/build-news-video.ts ${{ steps.date.outputs.realdate }}

      - name: Step D — Generate social images (5 sizes × 3 stories = 15)
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete'
        run: npx tsx scripts/generate-social-images.ts ${{ steps.date.outputs.realdate }}

      - name: Step E — Generate X thread (3 tweets)
        # Skip entirely when X is in PUBLISH_SKIP (x-thread.txt is unused then).
        # continue-on-error so a thread-gen hiccup never blocks the YouTube publish.
        if: env.RUN_MODE != 'publish' && env.RUN_MODE != 'delete' && !contains(format(',{0},', env.PUBLISH_SKIP), ',x,')
        continue-on-error: true
        run: npx tsx scripts/generate-x-thread.ts ${{ steps.date.outputs.realdate }}

      - name: Step F0 — Upload preview to Drive (best effort)
        if: env.RUN_MODE == 'preview' || env.RUN_MODE == 'full'
        continue-on-error: true
        run: npx tsx scripts/upload-results-to-drive.ts ${{ steps.date.outputs.realdate }}

      # --- Publish phase (publish / full) ---
      - name: Step F1 — Download approved video from Drive
        if: env.RUN_MODE == 'publish'
        run: npx tsx scripts/fetch-approved-video.ts ${{ steps.date.outputs.realdate }}

      - name: Step F2 — Publish to all 4 platforms (xvfb-wrapped, hardened flags)
        if: env.RUN_MODE == 'publish' || env.RUN_MODE == 'full'
        run: |
          xvfb-run -a \
            --server-args="-screen 0 1280x1920x24 -ac +extension RANDR +extension GLX +extension COMPOSITE -noreset -dpi 96" \
            npx tsx scripts/publish-all.ts ${{ steps.date.outputs.realdate }}

      - name: Step Delete — Remove YouTube videos
        if: env.RUN_MODE == 'delete'
        env:
          DELETE_VIDEO_IDS: ${{ github.event.inputs.delete_video_ids }}
        run: npx tsx scripts/delete-videos.ts

      - name: Step G — Upload final results to Drive (best effort)
        if: always()
        continue-on-error: true
        run: npx tsx scripts/upload-results-to-drive.ts ${{ steps.date.outputs.realdate }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailyworld60-${{ steps.date.outputs.work }}
          path: |
            output/${{ steps.date.outputs.work }}/news-*.mp4
            output/${{ steps.date.outputs.work }}/yt-thumbnail-*.png
            output/${{ steps.date.outputs.work }}/ig-*.png
            output/${{ steps.date.outputs.work }}/tiktok-*.png
            output/${{ steps.date.outputs.work }}/x-thread.txt
            output/${{ steps.date.outputs.work }}/publish-results.json
            output/${{ steps.date.outputs.work }}/script-en.json
            output/${{ steps.date.outputs.work }}/script-jp.json
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          git config user.name "Daily World 60 Bot"
          git config user.email "bot@dailyworld60"
          git add output/${{ steps.date.outputs.work }}/publish-results.json 2>/dev/null || true
          git commit -m "results ${{ steps.date.outputs.work }} [${{ env.RUN_MODE }}]" || true
          git push || true
