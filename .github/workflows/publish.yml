name: Daily World 60 — Publish

on:
  schedule:
    # 18:30 UTC = 06:30 NZST — cron は「動画生成のみ」(投稿しない)
    - cron: '30 18 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: "実行モード"
        required: true
        default: "preview"
        type: choice
        options:
          - preview      # 動画生成のみ、投稿しない (毎朝の cron と同じ動作)
          - publish      # 既存の preview 成果物を使って実投稿
          - full         # 動画生成 + 投稿 を一気にやる（要注意）
      date:
        description: "日付上書き (YYYY-MM-DD UTC)"
        required: false
        default: ""
      skip_youtube:
        description: "YouTube をスキップ (重複投稿回避)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DRIVE_FOLDER_NAME: "Daily World 60"

      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}

      YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
      YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
      YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}

      GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
      GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
      GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}

      X_COOKIES_B64: ${{ secrets.X_COOKIES_B64 }}
      INSTAGRAM_COOKIES_B64: ${{ secrets.INSTAGRAM_COOKIES_B64 }}
      TIKTOK_COOKIES_B64: ${{ secrets.TIKTOK_COOKIES_B64 }}

      EN_VOICE: en-US-AvaNeural

      # cron 起動 → 常に preview。手動 dispatch → 入力の mode を尊重。
      RUN_MODE: ${{ github.event_name == 'schedule' && 'preview' || github.event.inputs.mode }}
      DATE_OVERRIDE: ${{ github.event.inputs.date }}
      PUBLISH_SKIP: ${{ github.event.inputs.skip_youtube == 'true' && 'youtube' || '' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF, keyless)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.WIF_PROVIDER }}
          service_account: ${{ secrets.WIF_SERVICE_ACCOUNT }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install ffmpeg + librsvg + xvfb (for headed Playwright)
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg librsvg2-bin xvfb

      - name: Install edge-tts
        run: pip install edge-tts

      - name: Install Node deps
        run: npm ci

      - name: Install Playwright Chromium
        if: env.RUN_MODE != 'preview'
        run: npx playwright install --with-deps chromium

      - name: Resolve date
        id: date
        run: |
          if [ -n "${{ env.DATE_OVERRIDE }}" ]; then
            DATE="${{ env.DATE_OVERRIDE }}"
          else
            DATE=$(date -u +%Y-%m-%d)
          fi
          echo "value=$DATE" >> $GITHUB_OUTPUT
          mkdir -p output/$DATE
          echo "Working date: $DATE"
          echo "Run mode:     ${{ env.RUN_MODE }}"

      # --- Generation phase (preview / full) ---
      - name: Step A — Fetch scripts from Drive
        if: env.RUN_MODE != 'publish'
        run: npx tsx scripts/fetch-scripts-from-drive.ts ${{ steps.date.outputs.value }}

      - name: Step B — Per-story narrations (voice + vtt)
        if: env.RUN_MODE != 'publish'
        run: npx tsx scripts/tts-per-story.ts ${{ steps.date.outputs.value }}

      - name: Step C — Build 3 news videos (60s each, VTT-synced)
        if: env.RUN_MODE != 'publish'
        run: npx tsx scripts/build-news-video.ts ${{ steps.date.outputs.value }}

      - name: Step D — Generate social images (5 sizes × 3 stories = 15)
        if: env.RUN_MODE != 'publish'
        run: npx tsx scripts/generate-social-images.ts ${{ steps.date.outputs.value }}

      - name: Step E — Generate X thread (3 tweets)
        if: env.RUN_MODE != 'publish'
        run: npx tsx scripts/generate-x-thread.ts ${{ steps.date.outputs.value }}

      - name: Step F0 — Upload preview to Drive (best effort)
        if: env.RUN_MODE == 'preview' || env.RUN_MODE == 'full'
        continue-on-error: true
        run: npx tsx scripts/upload-results-to-drive.ts ${{ steps.date.outputs.value }}

      # --- Publish phase (publish / full) ---
      - name: Step F1 — Download approved video from Drive
        if: env.RUN_MODE == 'publish'
        run: npx tsx scripts/fetch-approved-video.ts ${{ steps.date.outputs.value }}

      - name: Step F2 — Publish to all 4 platforms (xvfb-wrapped for headed Playwright)
        if: env.RUN_MODE == 'publish' || env.RUN_MODE == 'full'
        run: xvfb-run -a --server-args="-screen 0 1280x1920x24" npx tsx scripts/publish-all.ts ${{ steps.date.outputs.value }}

      - name: Step G — Upload final results to Drive (best effort)
        if: always()
        continue-on-error: true
        run: npx tsx scripts/upload-results-to-drive.ts ${{ steps.date.outputs.value }}

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dailyworld60-${{ steps.date.outputs.value }}
          path: |
            output/${{ steps.date.outputs.value }}/news-*.mp4
            output/${{ steps.date.outputs.value }}/yt-thumbnail-*.png
            output/${{ steps.date.outputs.value }}/ig-*.png
            output/${{ steps.date.outputs.value }}/tiktok-*.png
            output/${{ steps.date.outputs.value }}/x-thread.txt
            output/${{ steps.date.outputs.value }}/publish-results.json
            output/${{ steps.date.outputs.value }}/script-en.json
            output/${{ steps.date.outputs.value }}/script-jp.json
          retention-days: 30

      - name: Commit results
        if: always()
        run: |
          git config user.name "Daily World 60 Bot"
          git config user.email "bot@dailyworld60"
          git add output/${{ steps.date.outputs.value }}/publish-results.json 2>/dev/null || true
          git commit -m "results ${{ steps.date.outputs.value }} [${{ env.RUN_MODE }}]" || true
          git push || true
