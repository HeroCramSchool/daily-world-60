<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440">
  <defs>
    <linearGradient id="b1bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FB923C"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <rect width="2560" height="1440" fill="url(#b1bg)"/>

  <!-- Left: large white circle with globe + 60 (icon 02 echo) -->
  <g transform="translate(820 720)">
    <circle r="240" fill="#FFFFFF"/>
    <g stroke="#0F172A" stroke-width="7" fill="none" stroke-linecap="round">
      <circle r="180"/>
      <ellipse rx="180" ry="60"/>
      <ellipse rx="180" ry="120"/>
      <ellipse rx="60" ry="180"/>
      <ellipse rx="120" ry="180"/>
    </g>
    <text y="55" text-anchor="middle" font-family="Helvetica, Arial Black, sans-serif" font-size="180" font-weight="900" fill="#DC2626" stroke="#FFFFFF" stroke-width="8" paint-order="stroke" letter-spacing="-8">60</text>
  </g>

  <!-- Right: channel name -->
  <text x="1180" y="755" font-family="Helvetica, Arial Black, sans-serif" font-size="180" font-weight="900" fill="#FFFFFF" letter-spacing="8">DAILY WORLD 60</text>
</svg>
