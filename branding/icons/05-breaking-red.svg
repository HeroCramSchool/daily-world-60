<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#DC2626"/>
      <stop offset="50%" stop-color="#B91C1C"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg5)"/>

  <!-- top "LIVE" bar -->
  <rect x="0" y="40" width="512" height="60" fill="#0F172A"/>
  <circle cx="80" cy="70" r="12" fill="#FBBF24">
    <animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite"/>
  </circle>
  <text x="110" y="80" font-family="Helvetica, Arial Black, sans-serif" font-size="32" font-weight="900" fill="#FFFFFF" letter-spacing="6">LIVE</text>
  <text x="490" y="80" text-anchor="end" font-family="Helvetica, Arial, sans-serif" font-size="24" font-weight="600" fill="#FBBF24" letter-spacing="3">EVERY DAY</text>

  <!-- center BIG 60 with double border -->
  <text x="256" y="310" text-anchor="middle" font-family="Helvetica, Arial Black, sans-serif" font-size="220" font-weight="900" fill="#FFFFFF" letter-spacing="-8">60</text>

  <!-- bottom "WORLD NEWS" -->
  <rect x="0" y="380" width="512" height="80" fill="#0F172A"/>
  <text x="256" y="435" text-anchor="middle" font-family="Helvetica, Arial Black, sans-serif" font-size="48" font-weight="900" fill="#FFFFFF" letter-spacing="6">WORLD NEWS</text>

  <!-- subtitle -->
  <text x="256" y="490" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="600" fill="#FFFFFF" opacity="0.85" letter-spacing="4">SIMPLE ENGLISH · DAILY</text>
</svg>
