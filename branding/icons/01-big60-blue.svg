<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg1" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#1E3A8A"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </radialGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#bg1)"/>

  <!-- subtle globe -->
  <g opacity="0.15">
    <circle cx="256" cy="256" r="200" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="200" ry="60" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="200" ry="100" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="200" ry="140" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="80" ry="200" fill="none" stroke="#FFFFFF" stroke-width="2"/>
    <ellipse cx="256" cy="256" rx="140" ry="200" fill="none" stroke="#FFFFFF" stroke-width="2"/>
  </g>

  <!-- "DAILY WORLD" -->
  <text x="256" y="125" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="34" font-weight="700" fill="#FFFFFF" letter-spacing="6">DAILY WORLD</text>

  <!-- BIG 60 -->
  <text x="256" y="370" text-anchor="middle" font-family="Helvetica, Arial Black, sans-serif" font-size="320" font-weight="900" fill="url(#gold1)" letter-spacing="-12">60</text>

  <!-- bottom tag -->
  <text x="256" y="450" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="22" font-weight="500" fill="#FFFFFF" opacity="0.7" letter-spacing="4">SECONDS · DAILY · GLOBAL</text>
</svg>
